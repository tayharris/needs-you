name: Bug report
description: Something in the Mac app, hub, CLI or an integration doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste tokens (`ny_…`), peer secrets, invite links or codes (`nyi_…`, `/join/…`), or the contents of `~/.config/needs-you/env`.** Replace hostnames you'd rather not share with `hub-a.example.ts.net` or `devbox`. Security problems go through [SECURITY.md](https://github.com/tayharris/needs-you/blob/main/SECURITY.md), not an issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mac app (NeedsYou.app)
        - Hub built into the Mac app
        - Server hub (needs_you_hub.py)
        - needs-you CLI
        - Invites / joining a machine
        - An agent's hooks (Claude Code, Codex, Gemini, opencode, ...)
        - Orca integration
        - MCP server
        - CI / cron / systemd / GitHub integration
        - Updates
        - Docs or site
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: needs-you version
      description: "`needs-you --version` on the sender, the app's version (right-click the pill → About Needs You), or the commit."
      placeholder: "CLI 0.3.0, app 0.3.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Of each machine involved.
      placeholder: "Mac: macOS 15.1, Apple silicon. Sender: Ubuntu 24.04, python3 3.12"
    validations:
      required: true
  - type: dropdown
    id: hub
    attributes:
      label: Hub
      description: Where your items are stored.
      options:
        - The hub built into the Mac app
        - A server hub (Linux, systemd)
        - The Mac's hub peered with server hubs
        - Not sure
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or tool, and its version
      description: If an agent or integration is involved.
      placeholder: "Claude Code 2.1.4, Codex CLI 0.50.0, or n/a"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. needs-you add --key "personal:test:x" --title "..."
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: needs-you doctor
      description: "The output of `needs-you doctor` on the sender, if one is involved. It never prints the token; check for hostnames you'd rather not share."
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or other output
      description: "CLI output, `journalctl -u needs-you-hub`, the `/v1/health` response, the hook log (`NEEDS_YOU_HOOK_LOG`), or Console.app lines. Redact tokens."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read [troubleshooting](https://needsyou.app/guides/troubleshooting.html).
          required: true
        - label: This report contains no tokens, secrets, invite links or codes.
          required: true
