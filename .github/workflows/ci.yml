# Tests on every push and PR, and the gate the release workflow calls before it builds.
# Same suites as the test-all skill. See docs/roadmap/ci-cd.md.
name: ci

on:
  push:
    branches: [main, 'tay/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        # Repo variable CI_LINUX_RUNNERS (JSON list of runs-on values) switches to self-hosted,
        # e.g. [["self-hosted","linux"]]. Unset: GitHub's images. See docs/roadmap/ci-cd.md.
        # Pull requests from forks never run on self-hosted runners.
        os: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && '["ubuntu-22.04","ubuntu-latest"]' || vars.CI_LINUX_RUNNERS || '["ubuntu-22.04","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The system python3 on purpose: it's what server hubs and senders run.
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m unittest discover -s tests

  python-macos-39:
    # Repo variable CI_MAC_RUNNER (JSON runs-on value), e.g. ["self-hosted","macOS"].
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && '"macos-14"' || vars.CI_MAC_RUNNER || '"macos-14"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compatibility floor: stdlib-only, 3.9 syntax.
      - run: /usr/bin/python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 9), sys.version'
      - run: /usr/bin/python3 -m unittest discover -s tests

  mac:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && '"macos-latest"' || vars.CI_MAC_RUNNER || '"macos-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # bundle.sh uses the commit count as the build number
          persist-credentials: false
      - run: mac/scripts/test.sh
      - run: mac/scripts/bundle.sh

  shellcheck:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && '"ubuntu-latest"' || vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Preinstalled on GitHub's Ubuntu images.
      - run: shellcheck --version
      - run: shellcheck -S warning -f gcc $(git ls-files '*.sh')

  lint:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && '"ubuntu-latest"' || vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the PR's base branch, for the commit-message checks
          persist-credentials: false
      # Hard rule 5 (no tailnet names or addresses but the examples) on every file, and no
      # Co-Authored-By / "Generated with" lines in the PR's commits. A push has no base: files only.
      - run: /usr/bin/python3 scripts/lint_repo.py
        env:
          NEEDS_YOU_LINT_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'none' }}
