    - region [ref=f3e29]:
      - heading "How it works" [level=2] [ref=f3e30]
      - list [ref=f3e31]:
        - listitem [ref=f3e32]:
          - strong [ref=f3e33]: Agents post.
          - text: A Claude session, a cron job or a CI step says “I need you for this” with one command.
        - listitem [ref=f3e34]:
          - strong [ref=f3e35]: The pill shows it.
          - text: It floats over everything on your Mac and never takes focus from what you're typing.
        - listitem [ref=f3e36]:
          - strong [ref=f3e37]: It goes away when handled.
          - text: The sender clears it, or you click Done. Nothing piles up.
